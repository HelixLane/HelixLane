[package]
name = "helixlane"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "HelixLane desktop application built with Rust and GPUI Kit"
license = "Apache-2.0"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit"]

[[bin]]
name = "helixlane"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
gpui-kit = { version = "0.8.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs", "process"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
alacritty_terminal = "0.25"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored", "apple-native", "windows-native"] }
zeroize = "1"

russh-sftp = "3.0.1"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
libc = "0.2"
hmac = "0.12"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_Foundation", "Win32_System_Pipes"] }
